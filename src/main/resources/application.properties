spring.application.name=sindaco
server.port=8080

# PostgreSQL (valores por defecto para desarrollo local; se pueden cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sindaco}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:oli}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seguridad JWT
jwt.secret=${JWT_SECRET:sindaco-clave-secreta-para-desarrollo-cambiar-en-produccion-2026}
jwt.expiration-minutes=${JWT_EXPIRATION:480}

# Origen permitido para el frontend (cambiar por el dominio real en producción)
sindaco.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
