spring.application.name=sindaco
server.port=8080

# PostgreSQL (valores por defecto para desarrollo local; se pueden cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sindaco}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
# "update" crea o ajusta tablas solo mientras desarrollamos. Al cerrar el modelo físico (3.6) se cambiará a "validate" con scripts de migración.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
