<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#ffffff; font-family:"Segoe UI",Arial,sans-serif; }
  svg text { font-family:"Segoe UI",Arial,sans-serif; }
  .titulo { font-size:16px; font-weight:600; fill:#1f2937; }
  .cls { fill:#f8fafc; stroke:#1e3a5f; stroke-width:2; }
  .cab { fill:#dbeafe; stroke:#1e3a5f; stroke-width:2; }
  .nombre { font-size:14px; font-weight:700; fill:#0f172a; }
  .attr { font-size:12px; fill:#334155; }
  .rel { stroke:#475569; stroke-width:1.8; fill:none; }
  .dep { stroke:#64748b; stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
  .etq { font-size:11.5px; fill:#1d4ed8; }
</style>
</head>
<body>
<svg width="1100" height="430" viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="25" y="28" class="titulo">Figura 78. Relación entre MVC, DAO y la base de datos en SINDACO</text>

  <g>
    <rect x="25" y="120" width="170" height="110" rx="3" class="cls"/>
    <rect x="25" y="120" width="170" height="30" rx="3" class="cab"/>
    <text x="110" y="140" text-anchor="middle" class="nombre">VistaAlumnos</text>
    <text x="40" y="170" class="attr">«Vista»</text>
    <text x="40" y="192" class="attr">renderizar()</text>
    <text x="40" y="214" class="attr">mostrarError()</text>
  </g>

  <g>
    <rect x="255" y="115" width="190" height="120" rx="3" class="cls"/>
    <rect x="255" y="115" width="190" height="30" rx="3" class="cab"/>
    <text x="350" y="135" text-anchor="middle" class="nombre">ControladorAlumnos</text>
    <text x="270" y="165" class="attr">«Controlador»</text>
    <text x="270" y="187" class="attr">listar()</text>
    <text x="270" y="209" class="attr">buscar(id)</text>
  </g>

  <g>
    <rect x="505" y="120" width="175" height="110" rx="3" class="cls"/>
    <rect x="505" y="120" width="175" height="30" rx="3" class="cab"/>
    <text x="592" y="140" text-anchor="middle" class="nombre">ModeloAlumno</text>
    <text x="520" y="170" class="attr">«Modelo»</text>
    <text x="520" y="192" class="attr">nombreCompleto()</text>
    <text x="520" y="214" class="attr">dniValido()</text>
  </g>

  <g>
    <rect x="740" y="115" width="190" height="120" rx="3" class="cls"/>
    <rect x="740" y="115" width="190" height="30" rx="3" class="cab"/>
    <text x="835" y="135" text-anchor="middle" class="nombre">AlumnoDao</text>
    <text x="755" y="165" class="attr">«DAO»</text>
    <text x="755" y="187" class="attr">listar()</text>
    <text x="755" y="209" class="attr">buscarPorId()</text>
  </g>

  <g>
    <rect x="740" y="295" width="190" height="90" rx="3" class="cls"/>
    <rect x="740" y="295" width="190" height="30" rx="3" class="cab"/>
    <text x="835" y="315" text-anchor="middle" class="nombre">PostgreSQL</text>
    <text x="755" y="345" class="attr">tabla: alumnos</text>
    <text x="755" y="367" class="attr">«BD real»</text>
  </g>

  <g>
    <rect x="255" y="295" width="190" height="90" rx="3" class="cls"/>
    <rect x="255" y="295" width="190" height="30" rx="3" class="cab"/>
    <text x="350" y="315" text-anchor="middle" class="nombre">AlumnoDaoClient</text>
    <text x="270" y="345" class="attr">«Cliente»</text>
    <text x="270" y="367" class="attr">usa el DAO</text>
  </g>

  <path d="M 195 175 L 255 175" class="rel" marker-end="url(#arrow)"/>
  <text x="197" y="165" class="etq">petición</text>

  <path d="M 445 175 L 505 175" class="rel" marker-end="url(#arrow)"/>
  <text x="447" y="165" class="etq">datos / reglas</text>

  <path d="M 350 235 C 350 270 600 270 740 200" class="rel" marker-end="url(#arrow)"/>
  <text x="470" y="258" class="etq">obtiene los datos mediante DAO</text>

  <path d="M 835 235 L 835 295" class="rel" marker-end="url(#arrow)"/>
  <text x="845" y="270" class="etq">JDBC / SQL</text>

  <path d="M 740 340 L 445 340" class="dep" marker-end="url(#arrowD)"/>
  <text x="560" y="330" class="etq">DTO / Cliente usa DAO</text>

  <path d="M 255 340 C 120 340 110 240 110 230" class="dep" marker-end="url(#arrowD)"/>
  <text x="125" y="290" class="etq">respuesta</text>
</svg>
</body>
</html>
